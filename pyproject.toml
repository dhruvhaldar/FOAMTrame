[project]
name = "foamtrame"
version = "0.1.0"
description = "A browser-based OpenFOAM workspace built with Trame, VTK, and Docker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cachebox==6.1.2",
  "docker==7.2.0",
  "flask==3.1.3",
  "flask-compress==1.24",
  "psutil==7.2.2",
  "requests==2.34.2",
  "trame==3.13.2",
  "trame-vtk==2.11.15",
  "trame-vuetify==3.2.5",
  "vtk==9.6.2",
]

[dependency-groups]
dev = [
  "codeaudit==1.8.1 ; python_full_version >= '3.11'",
  "pytest==8.4.2",
  "ruff==0.16.1",
  "ty==0.0.72",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["scratch_*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"tabs/plots_tab.py" = ["E402"]

[tool.uv]
package = false
link-mode = "copy"

[tool.ty.src]
exclude = [
  "scratch_*.py",
]

[tool.ty.analysis]
allowed-unresolved-imports = ["accelerator", "pyvista"]

[tool.ty.environment]
python-platform = "all"

[[tool.ty.overrides]]
include = [
  "benchmarks/benchmark_cachebox.py",
  "tests/integration/test_case_capabilities.py",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: persistence and service-boundary integration tests",
  "smoke: launches the complete FOAMTrame server and checks HTTP availability",
]
