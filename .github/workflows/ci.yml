name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.10.12"
      - name: Install runtime and test dependencies
        run: uv sync --locked
      - name: Runtime diagnostics
        run: uv run --locked python manage.py doctor --skip-docker
      - name: Compile Python modules
        run: uv run --locked python -m compileall -q app.py app_state.py database.py runtime.py manage.py run.py install.py uv_bootstrap.py tabs backend
      - name: Run integration and smoke tests
        run: uv run --locked pytest -q
