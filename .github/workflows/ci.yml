name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Runtime diagnostics
        run: python manage.py doctor --skip-docker
      - name: Compile Python modules
        run: python -m compileall -q app.py app_state.py database.py runtime.py manage.py run.py tabs backend
      - name: Run integration and smoke tests
        run: python -m unittest discover -s tests -v

